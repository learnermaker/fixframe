name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions below were checked to run on node24 (checkout@v6, setup-node@v6, upload-artifact@v6, cache@v5), supported by current GitHub-hosted runners.
jobs:
  # Full-history secret scan with the gitleaks CLI over all refs. Deliberately not gitleaks-action: on pull_request it scans
  # only the PR's commits and needs extra API permissions. The binary is pinned and verified against a hard-coded sha256.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history (all refs)
        run: |
          echo "commits reachable from any ref: $(git rev-list --all --count)"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="--all" .

  # No build needed: fast feedback runs in parallel with the app job.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Production build, then acceptance and Playwright against that build.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fake values, not credentials. Present at build time so the secrets test can prove they never reach client assets.
      META_API_TOKEN: FF_SENTINEL_TOKEN_do-not-leak-7f3a9c
      FIXFRAME_PROVIDER_MODE: fixture
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix tests
      - run: npm run typecheck --prefix tests
      - run: npm run acceptance --prefix tests

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Install Playwright browser
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx --prefix tests playwright install-deps chromium
          else
            npx --prefix tests playwright install --with-deps chromium
          fi
      - run: npm run e2e --prefix tests
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore
