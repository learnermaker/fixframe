<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.33  0 0 0 0 0.3  0 0 0 0.55 -0.12"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#e4e1d8"/>
  <rect width="1280" height="720" filter="url(#grain)"/>
  <!-- Patch; the outline is shared with masks/ceiling-tile.svg -->
  <path filter="url(#soft)" fill="#a98a58" fill-opacity="0.55"
        d="M500 250 C560 205 680 215 735 255 C790 295 800 370 755 425 C715 475 620 495 555 465 C490 435 445 385 455 325 C460 290 475 268 500 250 Z"/>
  <path filter="url(#soft2)" fill="none" stroke="#7d5f33" stroke-opacity="0.7" stroke-width="9"
        d="M500 250 C560 205 680 215 735 255 C790 295 800 370 755 425 C715 475 620 495 555 465 C490 435 445 385 455 325 C460 290 475 268 500 250 Z"/>
  <path filter="url(#soft)" fill="#8f6f3f" fill-opacity="0.35"
        d="M560 300 C610 275 680 295 700 340 C715 385 660 425 600 410 C550 395 525 325 560 300 Z"/>
  <!-- Suspended ceiling grid -->
  <g fill="#f7f6f1" stroke="#b9b6ab" stroke-width="2">
    <rect x="-10" y="80" width="1300" height="16"/>
    <rect x="-10" y="620" width="1300" height="16"/>
    <rect x="30" y="-10" width="16" height="740"/>
    <rect x="360" y="-10" width="16" height="740"/>
    <rect x="890" y="-10" width="16" height="740"/>
    <rect x="1220" y="-10" width="16" height="740"/>
  </g>
  <rect width="1280" height="720" fill="url(#light)"/>
</svg>
