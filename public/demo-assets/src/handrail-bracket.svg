<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="plaster" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="4" seed="21"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.42  0 0 0 0 0.45  0 0 0 0.4 -0.08"/>
    </filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e6ea"/>
      <stop offset="0.4" stop-color="#a9aeb6"/>
      <stop offset="1" stop-color="#5f646c"/>
    </linearGradient>
    <g id="bracket">
      <rect x="-42" y="0" width="84" height="110" rx="8" fill="#6d727a"/>
      <rect x="-42" y="0" width="84" height="16" rx="6" fill="#8c9199"/>
      <rect x="-14" y="-52" width="28" height="60" fill="#7b8088"/>
      <circle cx="-22" cy="82" r="8" fill="#33363b"/>
      <circle cx="22" cy="82" r="8" fill="#33363b"/>
    </g>
  </defs>
  <rect width="1280" height="720" fill="#d8dbdf"/>
  <rect width="1280" height="720" filter="url(#plaster)"/>
  <!-- Mock rig floor -->
  <rect y="620" width="1280" height="100" fill="#8b8e92"/>
  <rect y="616" width="1280" height="6" fill="#6b6e72"/>
  <!-- Rail shadow -->
  <rect x="-10" y="262" width="1300" height="44" fill="#000" fill-opacity="0.22" filter="url(#shadow)"/>
  <!-- Aligned brackets -->
  <use href="#bracket" transform="translate(240 300)"/>
  <use href="#bracket" transform="translate(1040 300)"/>
  <!-- Displaced bracket; the outline is shared with masks/handrail-bracket.svg -->
  <use href="#bracket" transform="translate(640 318) rotate(14)"/>
  <!-- Rail -->
  <rect x="-10" y="222" width="1300" height="44" rx="6" fill="url(#rail)"/>
</svg>
